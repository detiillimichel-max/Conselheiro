<!DOCTYPE html>
<html lang="pt-BR">
<head><!-- PLAYABLE_TOUCH_PATCH_V1 --><script>
(function() {
  if (window.__playableTouchPatchInstalled) return;
  window.__playableTouchPatchInstalled = true;
  var origAdd = EventTarget.prototype.addEventListener;
  var blockedTypes = { touchstart: 1, touchmove: 1, wheel: 1 };
  EventTarget.prototype.addEventListener = function(type, listener, options) {
    if (blockedTypes[type]) {
      if (options === undefined || options === null) options = { passive: true };
      else if (typeof options === 'boolean') options = { capture: options, passive: true };
      else options = Object.assign({}, options, { passive: true });
    }
    return origAdd.call(this, type, listener, options);
  };
})();
</script><script>window.Intl=window.Intl||{};Intl.t=function(s){return(Intl._locale&&Intl._locale[s])||s;};</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conselheiro</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body>
<div class="bg-glow"></div>

<header class="topbar">
  <button class="icon-btn" id="menuBtn" aria-label="Abrir menu"><i data-lucide="menu"></i></button>
  <button class="pill-center" aria-label="Modo inteligente">Inteligente <i data-lucide="chevron-down"></i></button>
  <div style="width:44px"></div>
</header>

<div class="quick-menu" id="quickMenu" aria-hidden="true">
  <a href="https://detiillimichel-max.github.io/-Neural-iA/" aria-label="Abrir Neural IA"><i data-lucide="brain-circuit"></i><span>Neural IA</span></a>
  <a href="https://vibe-mensagens.vercel.app/" aria-label="Abrir Vibe Mensagens"><i data-lucide="message-circle"></i><span>Vibe Mensagens</span></a>
  <a href="https://detiillimichel-max.github.io/hubs-de-jogos/" aria-label="Abrir Hub de Jogos"><i data-lucide="gamepad-2"></i><span>Jogos</span></a>
</div>

<main class="hero" id="hero">
  <h1 class="hero-title" id="heroTitle">O que está na agenda<br>de hoje?</h1>
  <p class="hero-sub" id="heroSub">Sobre o que seu coração precisa hoje?<br>Escreva em português, do seu jeito.<br>Eu busco sabedoria em 3 fontes.</p>

  <div class="suggestions" id="suggestions">
    <button class="sugg" data-q="um conselho sobre amor">Amor ❤️</button>
    <button class="sugg" data-q="estou ansioso">Ansiedade 🌙</button>
    <button class="sugg" data-q="preciso de coragem">Coragem 🔥</button>
    <button class="sugg" data-q="conselho sobre trabalho">Trabalho 💼</button>
    <button class="sugg" data-q="conselho sobre fé">Fé ✟</button>
  </div>

  <div class="results" id="results"></div>
</main>

<div class="bottom-area">
  <div class="input-pill">
    <button class="plus-btn" id="neuralBtn" aria-label="Abrir Neural IA"><i data-lucide="plus"></i></button>
    <textarea id="input" rows="1" placeholder="Pergunte ao Conselheiro"></textarea>
    <button class="mic-btn" id="sendBtn" aria-label="Enviar pergunta"><i data-lucide="arrow-up"></i></button>
  </div>
</div>

<script src="script.js"></script>
<script>if(window.lucide) lucide.createIcons();</script>
</body>
</html>
