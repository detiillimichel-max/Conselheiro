<!DOCTYPE html>
<html lang="pt-BR">
<head><!-- PLAYABLE_TOUCH_PATCH_V1 --><script>
(function() {
  if (window.__playableTouchPatchInstalled) return;
  window.__playableTouchPatchInstalled = true;
  var origAdd = EventTarget.prototype.addEventListener;
  var blockedTypes = { touchstart: 1, touchmove: 1, wheel: 1 };
  EventTarget.prototype.addEventListener = function(type, listener, options) {
    if (blockedTypes[type]) {
      if (options === undefined || options === null) {
        options = { passive: true };
      } else if (typeof options === 'boolean') {
        options = { capture: options, passive: true };
      } else {
        options = Object.assign({}, options, { passive: true });
      }
    }
    return origAdd.call(this, type, listener, options);
  };
})();
</script><script>window.Intl=window.Intl||{};Intl.t=function(s){return(Intl._locale&&Intl._locale[s])||s;};</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conselheiro • Michel</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B0F1A">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="bg-glow"></div>

<header class="topbar">
  <button class="icon-btn" aria-label="menu">
    <svg width="18" height="12" viewBox="0 0 18 12" fill="none"><rect width="18" height="2" rx="1" fill="#8B95A9"/><rect y="5" width="12" height="2" rx="1" fill="#8B95A9"/><rect y="10" width="10" height="2" rx="1" fill="#8B95A9"/></svg>
  </button>
  <div class="pill-center">Inteligente <span>⌄</span></div>
  <div style="width:44px"></div>
</header>

<main class="hero" id="hero">
  <h1 class="hero-title" id="heroTitle">Michel, o que está na agenda<br>de hoje?</h1>
  <p class="hero-sub" id="heroSub">Sobre o que seu coração precisa hoje?<br>Escreva em português, do seu jeito.<br>Eu busco sabedoria em 3 fontes.</p>

  <div class="suggestions" id="suggestions">
    <button class="sugg" data-q="um conselho sobre amor">Amor ❤️</button>
    <button class="sugg" data-q="estou ansioso">Ansiedade 🌙</button>
    <button class="sugg" data-q="preciso de coragem">Coragem 🔥</button>
    <button class="sugg" data-q="conselho sobre trabalho">Trabalho 💼</button>
    <button class="sugg" data-q="conselho sobre fé">Fé ✟</button>
  </div>

  <div class="results" id="results"></div>
</main>

<div class="bottom-area">
  <div class="input-pill">
    <button class="plus-btn">+</button>
    <textarea id="input" rows="1" placeholder="Pergunte ao Conselheiro"></textarea>
    <button class="mic-btn" id="sendBtn">↑</button>
  </div>
  <nav class="bottom-nav">
    <div class="nav-pill">
      <button class="nav-item active"><span>⌂</span> Página Inicial</button>
      <button class="nav-item"><span>◍</span> Descobrir</button>
      <button class="nav-item"><span>⧉</span> Biblioteca</button>
    </div>
    <button class="chat-new-btn">◫</button>
  </nav>
</div>

<script src="js/app.js"></script>
</body>
</html>
